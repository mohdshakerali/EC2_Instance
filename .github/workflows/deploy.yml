name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/EC2_Instance
            git pull
            sudo docker build -t ec2-instance-app .
            sudo docker stop ec2-instance-app || true
            sudo docker rm ec2-instance-app || true
            sudo docker run -d -p 80:80 --name ec2-instance-app ec2-instance-app
